      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "MINTS GLOBAL",
      "description": "Premium visual storytelling, digital marketing, cybersecurity, and development agency.",

        "https://www.linkedin.com/company/mints-global",
        "https://www.instagram.com/mints.global"
      ],
      "address": [
        {
          "@type": "PostalAddress",
          "addressLocality": "Dubai",
          "addressCountry": "AE"
        },
        {
          "@type": "PostalAddress",
          "addressLocality": "London",
          "addressCountry": "UK"
        },
        {
          "@type": "PostalAddress",
          "addressLocality": "India",
          "addressCountry": "IN"
        }
      ],
      "knowsAbout": [
        "Digital Marketing",
        "Cybersecurity",
        "Web Development",
        "Content Creation",
        "Brand Identity",
        "Visual Storytelling"
      ]
    }
